<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="tabs">
      <button class="tab active" data-tab="timer">Timer</button>
      <button class="tab" data-tab="stats">Statistics</button>
    </nav>

    <main class="wrap">
      <!-- Project bar (shared by both tabs) -->
      <section class="card project-bar">
        <button id="goal-ring" class="goal-ring hidden" title="Today's goal — open Statistics">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="goal-track" cx="22" cy="22" r="19" />
            <circle id="goal-arc" class="goal-arc" cx="22" cy="22" r="19" pathLength="100" stroke-dasharray="0 100" />
            <circle id="goal-lap" class="goal-lap" cx="22" cy="22" r="14.5" pathLength="100" stroke-dasharray="0 100" />
          </svg>
          <span id="goal-mins" class="goal-mins"></span>
        </button>
        <button id="project-select" class="project-select" title="Switch project">
          <span id="project-dot" class="dot"></span>
          <span class="project-label"><span id="project-name"></span><span id="goal-label" class="goal-label hidden"></span></span>
          <span class="caret">▾</span>
        </button>
        <div id="project-menu" class="menu hidden"></div>
        <div class="project-actions">
          <button id="project-edit" class="icon-btn" title="Edit project">✎</button>
          <button id="project-new" class="link-btn">+ New Project</button>
        </div>
      </section>

      <!-- ===== Timer tab ===== -->
      <div id="tab-timer">
        <section class="card" id="entry-card">
          <!-- idle state -->
          <form id="start-form" autocomplete="off">
            <div class="start-row">
              <input id="title-input" class="input" placeholder="What are you working on?" maxlength="120" />
              <button type="submit" class="btn btn-start">▶ Start</button>
            </div>
            <div id="tag-picker" class="tag-picker"></div>
          </form>

          <!-- running state -->
          <div id="running" class="running hidden">
            <div class="running-info">
              <div id="running-title" class="running-title"></div>
              <div id="running-tags" class="pill-row"></div>
            </div>
            <div class="running-controls">
              <span id="running-clock" class="clock"><span class="live-dot"></span><span id="running-time">0:00:00</span></span>
              <button id="pause-btn" class="icon-btn" title="Pause">❚❚</button>
              <button id="running-edit" class="icon-btn" title="Edit">✎</button>
              <button id="stop-btn" class="btn btn-stop">■ Stop</button>
            </div>
          </div>
        </section>

        <section id="weekly" class="card weekly hidden"></section>

        <section class="manual-wrap">
          <button id="manual-btn" class="link-btn">+ Add time manually</button>
        </section>

        <section id="history"></section>
        <p id="history-empty" class="muted center">No sessions yet. Press Start to track your first one.</p>
      </div>

      <!-- ===== Statistics tab ===== -->
      <div id="tab-stats" class="hidden">
        <section class="stat-grid">
          <div class="card stat"><span class="stat-label">Total time</span><span id="s-total" class="stat-value"></span></div>
          <div class="card stat"><span class="stat-label">Sessions</span><span id="s-sessions" class="stat-value"></span></div>
          <div class="card stat"><span class="stat-label">Longest session</span><span id="s-longest" class="stat-value"></span><span id="s-longest-sub" class="stat-sub"></span></div>
          <div class="card stat"><span class="stat-label">Day record</span><span id="s-record" class="stat-value"></span><span id="s-record-sub" class="stat-sub"></span></div>
          <div id="s-goal-card" class="card stat hidden"><span class="stat-label">Goal days</span><span id="s-goal" class="stat-value"></span><span class="stat-sub">last 30 days</span></div>
        </section>
        <div class="weekly-link"><button id="weekly-btn" class="link-btn">Last week's recap →</button></div>

        <section class="card">
          <h2>Last 30 days</h2>
          <div class="chart-wrap">
            <div id="chart" class="chart"></div>
            <div id="chart-tip" class="chart-tip hidden"></div>
          </div>
          <div class="chart-axis"><span id="chart-from"></span><span>today</span></div>
          <div id="chart-legend" class="chart-legend"></div>
        </section>

        <section class="card">
          <div class="heat-head">
            <h2>Activity</h2>
            <select id="heat-range" class="select" aria-label="Year"></select>
          </div>
          <p id="heat-summary" class="heat-summary"></p>
          <div class="heat-wrap" id="heat-wrap">
            <div class="heat-col heat-days"><span class="heat-month"></span><b>Mon</b><b></b><b>Wed</b><b></b><b>Fri</b><b></b><b></b></div>
            <div id="heat-scroll" class="heat-scroll">
              <div id="heatmap" class="heatmap"></div>
            </div>
            <div id="heat-tip" class="chart-tip hidden"></div>
          </div>
          <div class="heat-legend">
            <span>Less</span>
            <i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i>
            <span>More</span>
          </div>
        </section>

        <section class="card">
          <h2>Time per tag</h2>
          <div id="tag-stats" class="tag-stats"></div>
        </section>

        <div class="center"><button id="export-btn" class="link-btn">Export this project as CSV</button></div>
      </div>
    </main>

    <!-- Floating mini timer (shown off the Timer tab while running) -->
    <button id="mini-timer" class="mini-timer hidden" title="Back to timer">
      <span id="mini-title"></span><span class="live-dot"></span><span id="mini-time" class="mono"></span>
    </button>

    <!-- Session recap card (slides up after a session is saved) -->
    <section id="recap" class="recap hidden" aria-live="polite"></section>
    <div id="toast" class="toast hidden" role="status"></div>

    <!-- Generic modal -->
    <dialog id="modal">
      <form id="modal-form" method="dialog" autocomplete="off">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div class="modal-actions">
          <button type="button" id="modal-delete" class="btn btn-danger-ghost hidden">Delete</button>
          <span class="spacer"></span>
          <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="modal-ok" class="btn btn-start">Save</button>
        </div>
      </form>
    </dialog>

    <script src="index.js"></script>
  </body>
</html>
